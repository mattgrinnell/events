<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="events">
<meta property="og:description" content="what matt's hosting">
<meta property="og:type" content="website">
<style>html,body{margin:0}html{color-scheme:dark}img{max-width:100%}[hidden]{display:none!important}</style>
<title>events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Karla:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* violet on ink (Matt's pick 2026-09-18, option C of six). one dark look on purpose: no light theme, so it renders the same on every phone. */
  :root {
    --ground: #12101c;
    --surface: #1b1828;
    --line: #2c2740;
    --ink: #efeaff;
    --muted: #a49dbd;
    --accent: #b48cff;
    --accent-ink: #120e22;
    --chip: #2c2740;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Karla", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding-inline: 20px;
    padding-block: 28px 56px;
  }
  a { color: inherit; }
  .wrap { max-width: 620px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: grid; gap: 6px; }
  .wordmark {
    font-family: "Syne", "Arial Black", sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 12vw, 72px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0;
    text-wrap: balance;
  }
  .wordmark span { color: var(--accent); }
  .tag { color: var(--muted); margin: 0; max-width: 40ch; }
  .events { display: grid; gap: 20px; }
  .event {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 20px 20px;
    display: grid;
    gap: 16px;
  }
  .event[hidden] { display: none !important; }
  .when {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .chip {
    background: var(--accent); color: var(--accent-ink);
    padding: 3px 9px; border-radius: 3px; letter-spacing: 0.06em;
  }
  .chip:empty { display: none; }
  .event h2 {
    font-family: "Syne", "Arial Black", sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 34px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .blurb { margin: 0; max-width: 60ch; }
  .stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
  .stop {
    display: grid; grid-template-columns: 92px 1fr; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .time {
    font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent);
    white-space: nowrap; padding-top: 1px;
  }
  .stop b { display: block; font-size: 18px; line-height: 1.25; }
  .stop .hood { color: var(--muted); }
  .stop .links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-weight: 700; font-size: 15px; }
  .stop .links a { text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .stop .note { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
  .rsvp {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: var(--accent-ink);
    font-family: "Syne", "Arial Black", sans-serif; font-weight: 800; font-size: 19px;
    padding: 14px 18px; border-radius: 4px; letter-spacing: -0.01em;
  }
  .rsvp:focus-visible, .stop a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .rsvp small { display: block; font-family: "Karla", sans-serif; font-weight: 400; font-size: 14px; opacity: 0.85; }
  .empty { border: 1px dashed var(--line); border-radius: 6px; padding: 28px 20px; color: var(--muted); }
  .empty[hidden] { display: none !important; }
  .past { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
  .past[hidden] { display: none !important; }
  .past h3 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 700; }
  .past ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .past li { display: flex; gap: 12px; align-items: baseline; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; }
  .past .d { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 82px; font-size: 15px; }
  footer { color: var(--muted); font-size: 15px; border-top: 1px solid var(--line); padding-top: 18px; max-width: 48ch; }
  @media (max-width: 420px) { .stop { grid-template-columns: 84px 1fr; } .time { font-size: 15px; } }
  @media (prefers-reduced-motion: no-preference) { .rsvp { transition: transform 120ms ease; } .rsvp:hover { transform: translateY(-1px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="wordmark">events</h1>
  </header>

  <section class="events" id="events">

    <!-- one <article> per event. data-date = YYYY-MM-DD local. past ones collapse on their own to one crossed-out line at the bottom, so NEVER delete a past article. keep it sparse: chip, title, stops (time / place / hood / links), rsvp. no blurb, no notes, no addresses (map link only). -->
    <article class="event" data-date="2026-09-18">
      <div class="when"><span class="chip" data-chip></span><span>fri, sep 18</span></div>
      <h2>oktoberfest then what so not</h2>
      <ul class="stops">
        <li class="stop">
          <span class="time">7:00 pm</span>
          <div>
            <b>fremont oktoberfest</b>
            <span class="hood">fremont</span>
            <div class="links">
              <a href="https://www.strangertickets.com/events/176352430/fremont-oktoberfest-2026" target="_blank" rel="noopener">tickets</a>
              <a href="https://www.google.com/maps/search/?api=1&query=3503+Phinney+Ave+N+Seattle+WA" target="_blank" rel="noopener">map</a>
            </div>
          </div>
        </li>
        <li class="stop">
          <span class="time">~10:30 pm</span>
          <div>
            <b>what so not at substation</b>
            <span class="hood">ballard</span>
            <div class="links">
              <a href="https://www.eventbrite.com/e/what-so-not-tickets-1990824690240" target="_blank" rel="noopener">tickets</a>
              <a href="https://www.google.com/maps/search/?api=1&query=645+NW+45th+St+Seattle+WA" target="_blank" rel="noopener">map</a>
            </div>
          </div>
        </li>
      </ul>
      <a class="rsvp" href="https://partiful.com/e/amOFY96bPKHnDFOeYB55" target="_blank" rel="noopener">rsvp on partiful</a>
    </article>

  </section>

  <div class="empty" id="empty" hidden>nothing on the books right now.</div>

  <section class="past" id="past" hidden>
    <h3>been there</h3>
    <ul id="past-list"></ul>
  </section>

</div>

<script>
  (function () {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
    var live = 0;
    var past = [];
    var cards = document.querySelectorAll(".event[data-date]");
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var p = card.getAttribute("data-date").split("-");
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      var diff = Math.round((d - today) / 86400000);
      var chip = card.querySelector("[data-chip]");
      if (diff < 0) {
        card.hidden = true;
        var h2 = card.querySelector("h2");
        var when = card.querySelector(".when span:last-child");
        past.push({ d: d, date: when ? when.textContent : "", title: h2 ? h2.textContent : "" });
        continue;
      }
      live++;
      var label = "";
      if (diff === 0) label = "tonight";
      else if (diff === 1) label = "tomorrow";
      else if (diff <= 6) label = "this " + days[d.getDay()];
      else label = "in " + diff + " days";
      if (chip) chip.textContent = label;
    }
    var empty = document.getElementById("empty");
    if (empty) empty.hidden = live > 0;
    var pastBox = document.getElementById("past");
    var list = document.getElementById("past-list");
    if (pastBox && list && past.length) {
      past.sort(function (a, b) { return b.d - a.d; });
      for (var j = 0; j < past.length; j++) {
        var li = document.createElement("li");
        var ds = document.createElement("span"); ds.className = "d"; ds.textContent = past[j].date;
        var ts = document.createElement("span"); ts.textContent = past[j].title;
        li.appendChild(ds); li.appendChild(ts); list.appendChild(li);
      }
      pastBox.hidden = false;
    }
  })();
</script>
</body>
</html>
