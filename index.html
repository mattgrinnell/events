    return new TextDecoder().decode(plain);
  }
  async function go(words, remember) {
    if (!words) return;
    if (!window.crypto || !crypto.subtle) { m.className = "msg bad"; m.textContent = "this browser can't open it, try chrome or safari"; return; }
    m.className = "msg"; m.textContent = "opening...";
    try {
      var html = await open(words);
      if (remember) { try { localStorage.setItem(KEY, words); } catch (e) {} }
      document.open(); document.write(html); document.close();
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch (e2) {}
      document.documentElement.className = "";
      m.className = "msg bad"; m.textContent = remember ? "nope, not those" : "";
      w.value = ""; w.focus();
    }
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); go(norm(w.value), true); });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) go(saved, false);
})();
